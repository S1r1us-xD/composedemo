name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker PATH
        shell: powershell
        run: |
          Add-Content $env:GITHUB_PATH "C:\Users\ashnm\AppData\Local\Programs\DockerDesktop\resources\bin"
          docker --version
          docker compose version

      - name: Deploy Application
        shell: powershell
        run: |
          docker compose up -d --build